<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamentos – Central de Cópias</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#3b75b8;--bk:#000;--gr:#e5e6e8;--dk:#2b3a6b;--bg:#f2f3f5;--tx:#111;--card:#fff;--ln:#d5d7db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15171b;--tx:#eee;--card:#1f2228;--ln:#3a3e46;--gr:#2a2e36}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header.top{background:#000;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.top img{height:44px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--bl);color:#fff;padding:7px 12px;border-radius:8px;font:700 13px Montserrat,Arial;cursor:pointer}
nav button.on{background:var(--bl)}
main{max-width:1000px;margin:auto;padding:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:17px;color:var(--bl)}
input,select,button.b{font:500 14px Montserrat,Arial;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);width:100%}
button.b{background:var(--bl);color:#fff;border:0;font-weight:700;cursor:pointer;width:auto}
button.b.s{background:var(--ln);color:var(--tx)}button.b.r{background:#b33}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.w{overflow-x:auto}table.l{width:100%;border-collapse:collapse;font-size:13px}
.l th,.l td{text-align:left;padding:7px;border-bottom:1px solid var(--ln)}.l td input{padding:6px;min-width:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.tot{font:800 20px Montserrat;color:var(--bl)}
/* folha do orçamento */
#sheet{width:210mm;max-width:100%;margin:auto;background:#fff;color:#000;border:1px solid var(--ln)}
.sh{background:#000;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:5px solid #fff}
.sh img{height:62px}.sh h1{margin:0;color:#fff;font:800 clamp(22px,5vw,38px) Montserrat}
.bar{height:14px;background:linear-gradient(90deg,var(--bl),var(--dk));margin:8px 0 18px}
.sb{margin:0 18px;background:var(--gr);border-radius:22px 22px 22px 22px;overflow:hidden;color:#000}
.sb table{width:100%;border-collapse:collapse}
.sb th{background:#000;color:var(--bl);font:800 italic 17px Montserrat;padding:12px;text-align:center}
.sb td{border:1px solid #444;border-width:0 1px 1px 0;padding:7px;text-align:center;height:34px;font-size:13px;font-weight:700}
.sb td:last-child{border-right:0;color:var(--bl)}
.sf{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;gap:10px}
.cl{color:var(--bl);font-weight:800;font-size:13px;text-align:center;line-height:1.5}
.pill{background:var(--bl);color:#fff;font:800 italic 26px Montserrat;padding:14px 30px;border-radius:30px;white-space:nowrap}
.ft{background:#000;margin-top:16px;padding:16px 22px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;font-size:14px;border-top:4px solid var(--bl)}
.ft b{color:var(--bl)}.ft .at{text-align:center;color:var(--bl);font-weight:800}.ft small{display:block;font-size:10px}
.hide{display:none}
@media print{@page{size:A4;margin:0}body{background:#fff}header.top,main>section,.noprint{display:none!important}main{padding:0;max-width:none}#sheetwrap{display:block!important}#sheet{border:0;width:210mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

 else{for(const c of Object.keys(D))D[c]=ls(c);if(!D.prods.length)seed()}
 render()}
function nav(){$('#nav').innerHTML=[['new','Novo orçamento'],['quotes','Salvos'],['prods','Produtos'],['cli','Clientes']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${t}</button>`).join('')+`<span style="color:#9ab;font-size:11px;align-self:center">${db?'☁ salvo na conta':'⚠ salvo só neste navegador'}</span>`}
function go(t){tab=t;render()}
function render(only){
 $('#dl').innerHTML=D.prods.map(p=>`<option value="${esc(p.cod)}">${esc(p.nome)} – ${R(p.preco)}</option>`).join('');
 if(only==='dl')return;
 nav();['new','quotes','prods','cli'].forEach(k=>$('#v-'+k).classList.toggle('hide',k!==tab));
 ({new:vNew,quotes:vQuotes,prods:vProds,cli:vCli})[tab]()}
const ss=q=>q.items.reduce((a,i)=>a+num(i.q)*num(i.v),0);
const tot=q=>Math.round(ss(q)*(1-(q.desc||0)/100)*100)/100;
/* NOVO ORÇAMENTO */
function vNew(){const q=cur;
 $('#v-new').innerHTML=`<div class="card"><h2>${q.num?'Orçamento nº '+q.num:'Novo orçamento'}</h2>
 <div class="g"><select id="cs" onchange="pickCli(this.value)"><option value="">Selecionar cliente cadastrado…</option>${D.cli.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select>
 <input id="cn" placeholder="Nome do solicitante" value="${esc(q.cli.n)}" oninput="cur.cli.n=this.value">
 <input id="ce" placeholder="Nome da empresa" value="${esc(q.cli.e)}" oninput="cur.cli.e=this.value">
 <input id="cc" placeholder="Contato e e-mail" value="${esc(q.cli.c)}" oninput="cur.cli.c=this.value">
 <input id="cj" placeholder="CNPJ do cliente" value="${esc(q.cli.j||'')}" oninput="this.value=mj(this.value);cur.cli.j=this.value">
 <input type="date" value="${q.date}" oninput="cur.date=this.value"></div></div>
 <div class="card"><h2>Itens</h2><div class="g"><input id="sc" list="dl" placeholder="Digite código ou nome do produto…" onchange="addP(this)"><button class="b" style="justify-self:start" onclick="addItem()">+ Item manual</button></div>
 <div class="w"><table class="l"><tr><th>Qtd</th><th>Descrição</th><th>Valor unid.</th><th>Subtotal</th><th></th></tr>
 ${q.items.map((i,n)=>`<tr><td><input style="width:70px" value="${esc(i.q)}" oninput="cur.items[${n}].q=this.value;sub()"></td><td><input value="${esc(i.d)}" oninput="cur.items[${n}].d=this.value"></td><td><input style="width:100px" value="${esc(i.v)}" oninput="cur.items[${n}].v=this.value;sub()"></td><td id="s${n}">${R(num(i.q)*num(i.v))}</td><td><button class="b r" onclick="cur.items.splice(${n},1);vNew()">×</button></td></tr>`).join('')}</table></div>
 <div class="row"><label style="display:flex;gap:6px;align-items:center;font-weight:700"><input type="checkbox" style="width:auto" ${q.desc?'checked':''} onchange="cur.desc=this.checked?5:0;sub()"> Aplicar desconto de 5%</label></div>
 <div class="row"><span class="tot" id="tt">${R(tot(q))}</span><span id="ds" style="font-size:13px">${q.desc?'Subtotal '+R(ss(q))+' − desconto '+R(ss(q)-tot(q)):''}</span><span style="flex:1"></span><button class="b" onclick="saveQ(1)">Salvar e visualizar</button><button class="b s" onclick="saveQ(0)">Salvar</button><button class="b s" onclick="cur=newQ();vNew()">Limpar</button></div></div>`}
function sub(){cur.items.forEach((i,n)=>{const e=$('#s'+n);if(e)e.textContent=R(num(i.q)*num(i.v))});$('#tt').textContent=R(tot(cur));$('#ds').textContent=cur.desc?'Subtotal '+R(ss(cur))+' − desconto '+R(ss(cur)-tot(cur)):''}
function pickCli(id){const c=D.cli.find(x=>x.id===id);if(!c)return;cur.cli={n:c.nome,e:c.empresa,c:c.contato,j:c.cnpj||''};vNew()}
function addP(el){const v=el.value.trim().toLowerCase();const p=D.prods.find(x=>x.cod.toLowerCase()===v)||D.prods.find(x=>x.nome.toLowerCase().includes(v));
 if(p){cur.items.push({q:'1',d:p.nome,v:String(p.preco).replace('.',',')});vNew();$('#sc').focus()}else el.value=''}
function addItem(){cur.items.push({q:'1',d:'',v:'0'});vNew()}
function saveQ(view){if(!cur.items.length)return alert('Adicione ao menos um item.');
 if(!cur.num)cur.num=Math.max(0,...D.quotes.map(x=>x.num||0))+1;cur.ts=Date.now();cur.total=tot(cur);
 save('quotes',JSON.parse(JSON.stringify(cur)));view?showSheet(cur):vNew()}
/* SALVOS */
function vQuotes(){const l=[...D.quotes].sort((a,b)=>b.ts-a.ts);
 $('#v-quotes').innerHTML=`<div class="card"><h2>Orçamentos salvos</h2><input id="fq" placeholder="Pesquisar por cliente, empresa ou nº…" oninput="fq()"><div class="w"><table class="l" id="tq"></table></div></div>`;fq()}
function fq(){const t=($('#fq')?.value||'').toLowerCase();
 $('#tq').innerHTML='<tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Total</th><th></th></tr>'+D.quotes.filter(q=>(q.num+' '+q.cli.n+' '+q.cli.e).toLowerCase().includes(t)).sort((a,b)=>b.ts-a.ts).map(q=>`<tr><td>${q.num}</td><td>${q.date.split('-').reverse().join('/')}</td><td>${esc(q.cli.n)} ${esc(q.cli.e)}</td><td>${R(tot(q))}</td><td><button class="b" onclick="showSheet(D.quotes.find(x=>x.id=='${q.id}'))">Abrir</button> <button class="b s" onclick="cur=JSON.parse(JSON.stringify(D.quotes.find(x=>x.id=='${q.id}')));go('new')">Editar</button> <button class="b s" onclick="dup('${q.id}')">Duplicar</button> <button class="b r" onclick="confirm('Excluir?')&&(del('quotes','${q.id}'),vQuotes())">×</button></td></tr>`).join('')}
function dup(id){cur=JSON.parse(JSON.stringify(D.quotes.find(x=>x.id===id)));cur.id='q'+Date.now();cur.num=0;cur.date=new Date().toISOString().slice(0,10);go('new')}
/* PRODUTOS */
function vProds(){$('#v-prods').innerHTML=`<div class="card"><h2>Produtos e valores</h2>
 <div class="g"><input id="pc" placeholder="Código"><input id="pn" placeholder="Descrição"><input id="pp" placeholder="Valor (ex: 3,50)"><button class="b" onclick="addProd()">Cadastrar</button></div>
 <div class="row"><button class="b s" onclick="seed()">${D.prods.length?'Importar itens que faltam (VALORES.pdf)':'Importar tabela de valores (VALORES.pdf)'}</button></div>
 <input id="fp" style="margin-top:10px" placeholder="Pesquisar por código ou nome…" oninput="fp()"><div class="w"><table class="l" id="tp"></table></div></div>`;fp()}
function fp(){const t=($('#fp')?.value||'').toLowerCase();
 $('#tp').innerHTML='<tr><th>Código</th><th>Descrição</th><th>Valor</th><th></th></tr>'+D.prods.filter(p=>(p.cod+' '+p.nome).toLowerCase().includes(t)).sort((a,b)=>a.cod.localeCompare(b.cod)).map(p=>`<tr><td><input value="${esc(p.cod)}" onchange="upP('${p.id}','cod',this.value)"></td><td><input value="${esc(p.nome)}" onchange="upP('${p.id}','nome',this.value)"></td><td><input value="${esc(String(p.preco).replace('.',','))}" onchange="upP('${p.id}','preco',num(this.value))"></td><td><button class="b r" onclick="del('prods','${p.id}');vProds()">×</button></td></tr>`).join('')}
function upP(id,k,v){const p=D.prods.find(x=>x.id===id);p[k]=v;save('prods',p);render('dl')}
function addProd(){const nome=$('#pn').value.trim();if(!nome)return;const cod=$('#pc').value.trim()||('P'+String(D.prods.length+1).padStart(3,'0'));
 if(D.prods.some(p=>p.cod===cod))return alert('Código já existe.');save('prods',{id:'p'+Date.now(),cod,nome,preco:num($('#pp').value)});vProds();render('dl')}
function seed(){const have=new Set(D.prods.map(p=>p.nome));let n=Math.max(0,...D.prods.map(p=>parseInt(String(p.cod).replace(/\D/g,''))||0));SEED.split('\n').forEach((l,i)=>{const[a,b]=l.split('|');if(have.has(a))return;n++;save('prods',{id:'p'+Date.now()+'_'+i,cod:'P'+String(n).padStart(3,'0'),nome:a,preco:+b})});vProds()}
/* CLIENTES */
function vCli(){$('#v-cli').innerHTML=`<div class="card"><h2>Clientes</h2>
 <div class="g"><input id="kn" placeholder="Nome"><input id="ke" placeholder="Empresa"><input id="kc" placeholder="Contato e e-mail"><input id="kj" placeholder="CNPJ" oninput="this.value=mj(this.value)"><button class="b" onclick="addCli()">Cadastrar</button></div>
 <div class="w"><table class="l"><tr><th>Nome</th><th>Empresa</th><th>Contato</th><th>CNPJ</th><th></th></tr>${[...D.cli].sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<tr><td><input value="${esc(c.nome)}" onchange="upC('${c.id}','nome',this.value)"></td><td><input value="${esc(c.empresa)}" onchange="upC('${c.id}','empresa',this.value)"></td><td><input value="${esc(c.contato)}" onchange="upC('${c.id}','contato',this.value)"></td><td><input value="${esc(c.cnpj||'')}" onchange="this.value=mj(this.value);upC('${c.id}','cnpj',this.value)"></td><td><button class="b r" onclick="del('cli','${c.id}');vCli()">×</button></td></tr>`).join('')}</table></div></div>`}
function mj(v){const d=String(v).replace(/\D/g,'').slice(0,14);return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')}
function upC(id,k,v){const c=D.cli.find(x=>x.id===id);c[k]=v;save('cli',c)}
function addCli(){const nome=$('#kn').value.trim();if(!nome)return;save('cli',{id:'c'+Date.now(),nome,empresa:$('#ke').value,contato:$('#kc').value,cnpj:$('#kj').value});vCli()}
/* FOLHA (modelo Orçamento.pdf) */
function showSheet(q){const rows=[...q.items];while(rows.length<12)rows.push(null);
 $('#sheet').innerHTML=`<div class="sh"><img src="${LOGO}"><h1>ORÇAMENTO</h1></div><div class="bar"></div>
 <div class="sb"><table><tr><th style="width:18%">Quantidade</th><th>Descrição</th><th style="width:24%">Valor Unid</th></tr>
 ${rows.map(i=>i?`<tr><td>${esc(i.q)}</td><td>${esc(i.d)}</td><td>${R(num(i.v))}</td></tr>`:'<tr><td></td><td></td><td></td></tr>').join('')}</table>
 <div class="sf"><div class="cl">${esc(q.cli.n)}<br>${esc(q.cli.e)}<br>${q.cli.j?'CNPJ: '+esc(q.cli.j)+'<br>':''}${esc(q.cli.c)}<br>${q.date.split('-').reverse().join('/')}<br>Orçamento nº ${q.num||''}</div><div style="text-align:right">${q.desc?`<div class="cl" style="text-align:right;margin-bottom:6px">Subtotal ${R(ss(q))}<br>Desconto de ${q.desc}%: − ${R(ss(q)-tot(q))}</div>`:''}<div class="pill">${R(tot(q))}</div></div></div></div>
 <div class="ft"><div style="line-height:1.9"><b style="font-size:16px">CNPJ: 25.174.699/0001-37</b><br>✉ arte@centraldecopias.com.br<br>✆ (35) 9.9963-3312<br>⌖ Av. Doutor Lisboa 126 - Pouso Alegre</div><div class="at"><small>Atenciosamente:</small>Allyson Vitorino</div></div>`;
 document.body.dataset.v=1;$('#sheetwrap').classList.remove('hide');document.querySelectorAll('main>section').forEach(s=>s.classList.add('hide'))}
function closeSheet(){$('#sheetwrap').classList.add('hide');render()}
init();
</script></body></html>
